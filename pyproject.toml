[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llmrelay"
version = "0.1.0"
description = "A local text API backed by your installed Codex or Claude CLI"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "LLMRelay contributors"}]

[project.scripts]
llmrelay = "llmrelay.server:main"

[tool.setuptools.packages.find]
include = ["llmrelay*"]
